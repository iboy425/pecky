<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pecky 帽子测试</title><style>body{margin:0;background:#f4efe5;color:#4b3828;font:17px system-ui,sans-serif}main{max-width:560px;margin:0 auto;padding:36px 20px}h1{font-size:30px;margin:0 0 8px}.card{background:#fffdfa;border:1px solid #e5d8c3;border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 4px 18px #5b43220d}button{border:0;border-radius:12px;padding:12px 16px;margin:4px;background:#69513c;color:#fff;font-size:16px}button.alt{background:#e8ded0;color:#4b3828}.ok{color:#23724c}.bad{color:#b14332}pre{white-space:pre-wrap;background:#f7f1e9;padding:12px;border-radius:10px;min-height:4em;font-size:13px}strong{font-size:22px}</style><main><h1>Pecky 帽子测试</h1><p>只连接帽子 COM7，不会连接椅子。</p><section class="card"><p id="connection">未连接</p><button id="connect">连接帽子</button><button id="disconnect" class="alt">断开</button><button id="pressure" class="alt">压力传感器自检</button></section><section class="card"><p>最近识别动作</p><strong id="action">等待动作</strong><p>抱头抗阻：按住压力片约 1 秒后松开。</p></section><section class="card"><p>实时设备状态</p><pre id="status">等待终端桥接…</pre></section><script>let ws;const $=id=>document.getElementById(id),show=x=>$('status').textContent=x+'\n'+$('status').textContent.slice(0,900);function close(){ws?.close();ws=null;$('connection').textContent='未连接'}$('connect').onclick=()=>{if(ws)return;ws=new WebSocket('ws://127.0.0.1:8765');ws.onopen=()=>{$('connection').innerHTML='<b class="ok">帽子已连接，正在接收</b>';show('已连接：识别已自动开始')};ws.onclose=()=>{$('connection').textContent='连接已断开';ws=null};ws.onerror=()=>show('连接失败：请先在 WSL 启动帽子桥接');ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='status')show(m.line);if(m.type==='event'){$('action').textContent={neck_extension:'后仰脖子',chin_tuck:'收下巴',head_resistance:'抱头抗阻'}[m.event.action]||m.event.action;show('已收到动作事件')}}};$('disconnect').onclick=close;$('pressure').onclick=()=>ws?ws.send('PRESSURE_TEST'):show('请先连接帽子');</script></main></html>
