<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>清闲椅子测试</title><style>body{margin:0;background:#eef4f4;color:#27464a;font:17px system-ui,sans-serif}main{max-width:560px;margin:0 auto;padding:36px 20px}h1{font-size:30px;margin:0 0 8px}.card{background:#fbfefd;border:1px solid #c8e1df;border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 4px 18px #2443440d}button{border:0;border-radius:12px;padding:12px 16px;margin:4px;background:#315e61;color:#fff;font-size:16px}button.alt{background:#dcebea;color:#27464a}.ok{color:#24704c}pre{white-space:pre-wrap;background:#edf6f5;padding:12px;border-radius:10px;min-height:4em;font-size:13px}strong{font-size:22px}</style><main><h1>清闲椅子测试</h1><p>只连接椅子 COM8，不会连接帽子。</p><section class="card"><p id="connection">未连接</p><button id="connect">连接椅子</button><button id="disconnect" class="alt">断开</button></section><section class="card"><p>最近识别动作</p><strong id="action">等待动作</strong><p>动作做完后回到中立约 1 秒，再做下一次。</p></section><section class="card"><p>实时设备状态</p><pre id="status">等待终端桥接…</pre></section><script>let ws;const $=id=>document.getElementById(id),show=x=>$('status').textContent=x+'\n'+$('status').textContent.slice(0,900);function close(){ws?.close();ws=null;$('connection').textContent='未连接'}$('connect').onclick=()=>{if(ws)return;ws=new WebSocket('ws://127.0.0.1:8766');ws.onopen=()=>{$('connection').innerHTML='<b class="ok">椅子已连接，正在接收</b>';show('已连接：识别已自动开始')};ws.onclose=()=>{$('connection').textContent='连接已断开';ws=null};ws.onerror=()=>show('连接失败：请先在 WSL 启动椅子桥接');ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='status')show(m.line);if(m.type==='event'){$('action').textContent={left_stretch:'向左拉伸',right_stretch:'向右拉伸',chest_extension:'胸椎舒展'}[m.recognizedAction.action]||m.recognizedAction.action;show('已收到动作事件')}}};$('disconnect').onclick=close;</script></main></html>
